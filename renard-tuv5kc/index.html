<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1b2a44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Renard">
  <title>Mon renard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="haut">
      <div class="identite">
        <h1 id="nom-renard">Mon renard</h1>
        <p id="depuis"></p>
      </div>
      <div class="jauges" id="jauges">
        <div class="jauge" data-stat="ventre"><span class="ico">🍎</span><div class="barre"><i></i></div></div>
        <div class="jauge" data-stat="bonheur"><span class="ico">💛</span><div class="barre"><i></i></div></div>
        <div class="jauge" data-stat="pelage"><span class="ico">✨</span><div class="barre"><i></i></div></div>
        <div class="jauge" data-stat="energie"><span class="ico">⚡</span><div class="barre"><i></i></div></div>
      </div>
    </header>

    <div class="scene" id="scene">
      <svg id="svg" viewBox="0 0 400 520" preserveAspectRatio="xMidYMax slice" aria-label="Ton renard dans une clairière enneigée">
        <defs>
          <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
            <stop id="ciel-haut" offset="0" stop-color="#18284a"/>
            <stop id="ciel-bas" offset="1" stop-color="#4b5f8c"/>
          </linearGradient>
          <radialGradient id="halo" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#fff8dc" stop-opacity=".55"/>
            <stop offset="1" stop-color="#fff8dc" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="neige" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f4f8fc"/>
            <stop offset="1" stop-color="#d7e3ef"/>
          </linearGradient>
          <g id="sapin">
            <path d="M0 0 L-26 40 L-12 40 L-34 76 L-16 76 L-40 112 L40 112 L16 76 L34 76 L12 40 L26 40 Z" fill="#1f4a3a"/>
            <path d="M0 0 L-10 16 L0 12 L10 16 Z M-14 44 L-26 62 L-12 56 L0 60 L12 56 L26 62 L14 44 L0 48 Z M-18 80 L-34 102 L-14 94 L0 98 L14 94 L34 102 L18 80 L0 86 Z" fill="#eef4fa" opacity=".9"/>
            <rect x="-6" y="112" width="12" height="16" fill="#4a3426"/>
          </g>
        </defs>

        <!-- Décor -->
        <rect width="400" height="520" fill="url(#ciel)"/>
        <g id="etoiles" fill="#fff">
          <circle cx="40" cy="40" r="1.4"/><circle cx="95" cy="80" r="1"/><circle cx="150" cy="30" r="1.6"/>
          <circle cx="220" cy="60" r="1"/><circle cx="270" cy="25" r="1.3"/><circle cx="350" cy="70" r="1.1"/>
          <circle cx="375" cy="20" r="1.5"/><circle cx="20" cy="120" r="1"/><circle cx="120" cy="140" r="1.2"/>
          <circle cx="330" cy="140" r="1"/><circle cx="190" cy="110" r=".9"/>
        </g>
        <g id="astre">
          <circle cx="285" cy="95" r="60" fill="url(#halo)"/>
          <circle id="astre-disque" cx="285" cy="95" r="24" fill="#fff4cc"/>
        </g>
        <path d="M0 300 Q 60 270 120 290 T 240 285 T 400 280 L400 400 L0 400 Z" fill="#9db2cc" opacity=".55"/>
        <use href="#sapin" transform="translate(70 252) scale(.85)"/>
        <use href="#sapin" transform="translate(100 270) scale(.65)"/>
        <use href="#sapin" transform="translate(335 246) scale(.95)"/>
        <use href="#sapin" transform="translate(300 275) scale(.6)"/>
        <path d="M0 380 Q 100 360 200 372 T 400 366 L400 520 L0 520 Z" fill="url(#neige)"/>
        <ellipse cx="195" cy="448" rx="110" ry="14" fill="#9fb3c9" opacity=".45" id="ombre"/>

        <!-- Le renard (coordonnées locales : pattes posées à y≈345) -->
        <g id="pos" transform="translate(-10 137) scale(.9)">
          <g id="renard">
            <g id="assis">
              <g id="queue">
                <path d="M232 334 C 290 350, 346 322, 352 270 C 356 236, 338 206, 314 194 C 322 226, 314 258, 294 278 C 274 298, 254 304, 232 304 Z" fill="#e8772e"/>
                <path d="M314 194 C 334 204, 352 226, 352 262 C 342 252, 332 244, 320 240 C 324 224, 321 206, 314 194 Z" fill="#fff6ea"/>
              </g>
              <ellipse cx="150" cy="318" rx="34" ry="28" fill="#d6662a"/>
              <ellipse cx="250" cy="318" rx="34" ry="28" fill="#d6662a"/>
              <path d="M162 222 C 140 262, 130 318, 152 346 L 248 346 C 270 318, 260 262, 238 222 Z" fill="#e8772e"/>
              <path d="M176 222 C 164 258, 172 298, 200 316 C 228 298, 236 258, 224 222 Z" fill="#fff6ea"/>
              <rect x="172" y="276" width="22" height="70" rx="11" fill="#e8772e"/>
              <rect x="206" y="276" width="22" height="70" rx="11" fill="#e8772e"/>
              <rect x="172" y="314" width="22" height="33" rx="11" fill="#3a2a22"/>
              <rect x="206" y="314" width="22" height="33" rx="11" fill="#3a2a22"/>

              <g id="tenue-echarpe" class="tenue">
                <path d="M160 214 Q200 236 240 214 L244 232 Q200 258 156 232 Z" fill="#c0392b"/>
                <path d="M172 222 L176 240 M192 228 L194 246 M212 228 L210 246 M230 222 L226 240" stroke="#f3d9b1" stroke-width="3"/>
                <path d="M214 236 L222 292 L240 288 L232 234 Z" fill="#c0392b"/>
                <path d="M222 292 L224 300 M229 291 L231 299 M236 289 L238 297" stroke="#c0392b" stroke-width="3"/>
              </g>
              <g id="tenue-noeud" class="tenue">
                <path d="M200 228 L176 214 L178 244 Z M200 228 L224 214 L222 244 Z" fill="#2f6db5"/>
                <circle cx="200" cy="229" r="7" fill="#24548c"/>
              </g>

              <g id="tete">
                <g id="oreille-g" class="oreille">
                  <path d="M146 134 L146 56 L194 104 Z" fill="#e8772e"/>
                  <path d="M154 122 L154 76 L182 106 Z" fill="#fbe3cf"/>
                  <path d="M146 56 L146 80 L163 73 Z" fill="#3a2a22"/>
                </g>
                <g id="oreille-d" class="oreille">
                  <path d="M254 134 L254 56 L206 104 Z" fill="#e8772e"/>
                  <path d="M246 122 L246 76 L218 106 Z" fill="#fbe3cf"/>
                  <path d="M254 56 L254 80 L237 73 Z" fill="#3a2a22"/>
                </g>
                <path d="M134 152 C 134 116, 164 98, 200 98 C 236 98, 266 116, 266 152 C 266 178, 246 198, 222 212 L 200 224 L 178 212 C 154 198, 134 178, 134 152 Z" fill="#e8772e"/>
                <path d="M140 166 L114 190 L152 184 Z M260 166 L286 190 L248 184 Z" fill="#e8772e"/>
                <path d="M146 160 C 158 188, 184 204, 200 224 C 216 204, 242 188, 254 160 C 238 174, 216 172, 200 180 C 184 172, 162 174, 146 160 Z" fill="#fff6ea"/>
                <path d="M118 188 L140 178 L152 186 Z M282 188 L260 178 L248 186 Z" fill="#fff6ea"/>
                <circle class="joue" cx="160" cy="178" r="9" fill="#ff8f8f" opacity="0"/>
                <circle class="joue" cx="240" cy="178" r="9" fill="#ff8f8f" opacity="0"/>

                <g class="yeux yeux-ouverts">
                  <g class="oeil"><ellipse cx="172" cy="150" rx="9" ry="11" fill="#2b1d16"/><circle cx="175" cy="146" r="3.2" fill="#fff"/></g>
                  <g class="oeil"><ellipse cx="228" cy="150" rx="9" ry="11" fill="#2b1d16"/><circle cx="231" cy="146" r="3.2" fill="#fff"/></g>
                </g>
                <g class="yeux yeux-contents" fill="none" stroke="#2b1d16" stroke-width="4.5" stroke-linecap="round">
                  <path d="M162 154 Q172 141 182 154"/><path d="M218 154 Q228 141 238 154"/>
                </g>
                <g class="yeux yeux-fermes" fill="none" stroke="#2b1d16" stroke-width="4" stroke-linecap="round">
                  <path d="M162 150 Q172 158 182 150"/><path d="M218 150 Q228 158 238 150"/>
                </g>
                <g class="sourcils" fill="none" stroke="#3a2a22" stroke-width="3.5" stroke-linecap="round">
                  <path d="M160 137 Q170 133 182 128"/><path d="M240 137 Q230 133 218 128"/>
                </g>

                <path id="nez" d="M190 190 Q200 184 210 190 Q206 199 200 201 Q194 199 190 190 Z" fill="#241712"/>
                <path class="bouche bouche-normale" d="M189 207 Q194.5 213 200 207 Q205.5 213 211 207" fill="none" stroke="#3a2a22" stroke-width="2.5" stroke-linecap="round"/>
                <path class="bouche bouche-triste" d="M190 211 Q200 203 210 211" fill="none" stroke="#3a2a22" stroke-width="2.5" stroke-linecap="round"/>
                <g class="bouche bouche-ouverte">
                  <ellipse cx="200" cy="211" rx="9" ry="8" fill="#5a1f1a"/>
                  <ellipse cx="200" cy="215" rx="5.5" ry="3.5" fill="#ef7f86"/>
                </g>

                <g id="tenue-bonnet" class="tenue">
                  <path d="M170 110 Q 186 52 250 30 Q 236 68 232 110 Z" fill="#c0392b"/>
                  <rect x="164" y="102" width="74" height="16" rx="8" fill="#fbfbfb"/>
                  <circle cx="252" cy="30" r="10" fill="#fbfbfb"/>
                </g>
                <g id="tenue-fleurs" class="tenue">
                  <path d="M156 112 Q200 96 244 112" fill="none" stroke="#5c8a3a" stroke-width="3"/>
                  <g fill="#f7c6d9"><circle cx="160" cy="111" r="6"/><circle cx="200" cy="102" r="7"/><circle cx="240" cy="111" r="6"/></g>
                  <g fill="#fff3a8"><circle cx="180" cy="105" r="5.5"/><circle cx="220" cy="105" r="5.5"/></g>
                  <g fill="#e58a3a"><circle cx="160" cy="111" r="2"/><circle cx="200" cy="102" r="2.2"/><circle cx="240" cy="111" r="2"/><circle cx="180" cy="105" r="1.8"/><circle cx="220" cy="105" r="1.8"/></g>
                </g>
              </g>
              <g id="noeuds"></g>
              <g id="balle-gueule"></g>
            </g>

            <g transform="translate(28 0)"><g id="dort">
              <path d="M110 336 C 100 290, 160 262, 225 266 C 285 270, 322 300, 316 336 Z" fill="#e8772e"/>
              <path d="M230 280 C 262 284, 290 300, 300 322" fill="none" stroke="#d6662a" stroke-width="3" stroke-linecap="round" opacity=".7"/>
              <path d="M316 330 C 322 364, 200 374, 120 358 C 100 354, 88 346, 92 336 C 130 348, 232 352, 302 322 Z" fill="#df6e28"/>
              <path d="M92 336 C 86 344, 92 358, 114 360 C 108 352, 108 344, 118 340 Z" fill="#fff6ea"/>
              <g id="tete-dort">
                <path d="M118 270 L 128 236 L 150 266 Z M150 266 L 168 240 L 172 272 Z" fill="#e8772e"/>
                <path d="M124 266 L 130 246 L 144 264 Z M154 264 L 165 249 L 167 268 Z" fill="#fbe3cf"/>
                <path d="M100 300 C 100 274, 130 260, 158 266 C 184 272, 192 296, 180 314 C 168 330, 120 332, 104 318 Z" fill="#e8772e"/>
                <path d="M104 318 C 98 304, 102 296, 112 300 C 130 306, 150 312, 168 318 C 150 330, 118 330, 104 318 Z" fill="#fff6ea"/>
                <path d="M128 292 Q 137 298 146 292" fill="none" stroke="#2b1d16" stroke-width="3.5" stroke-linecap="round"/>
                <ellipse cx="102" cy="310" rx="6" ry="4.5" fill="#241712"/>
              </g>
            </g></g>
          </g>
        </g>

        <g id="balle" style="display:none">
          <circle r="12" fill="#e2463b"/>
          <path d="M-11 -3 Q0 4 11 -3" stroke="#fff" stroke-width="3" fill="none"/>
        </g>
      </svg>

      <div class="flocons" id="flocons" aria-hidden="true"></div>
      <div class="bulle" id="bulle" hidden></div>
      <div class="effets" id="effets" aria-hidden="true"></div>
      <div class="brosse-curseur" id="brosse-curseur" hidden>🖌️</div>
      <p class="astuce" id="astuce"></p>
    </div>

    <div class="tiroir" id="tiroir" hidden></div>

    <nav class="actions" id="actions">
      <button data-action="caresser" aria-pressed="true"><span>✋</span>Caresser</button>
      <button data-action="brosser"><span>🖌️</span>Brosser</button>
      <button data-action="nourrir"><span>🍎</span>Nourrir</button>
      <button data-action="jouer"><span>🎾</span>Jouer</button>
      <button data-action="dormir"><span>🌙</span>Dodo</button>
      <button data-action="tenue"><span>🎀</span>Tenue</button>
    </nav>
  </div>

  <dialog id="accueil">
    <form method="dialog" id="form-nom">
      <div class="renardeau">🦊</div>
      <h2>Un petit renard t'a suivi jusqu'ici…</h2>
      <p>Il a l'air de vouloir rester avec toi. Comment veux-tu l'appeler ?</p>
      <input id="champ-nom" maxlength="16" autocomplete="off" placeholder="Son nom" required>
      <button class="bouton">Adopter</button>
    </form>
  </dialog>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
